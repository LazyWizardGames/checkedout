<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Checked Out</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0a14; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

  .o { stroke: #140d1c; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .hit { cursor: pointer; }
  text { pointer-events: none; }
</style>
</head>
<body>
<svg id="game" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid meet"></svg>
<script src="art.js"></script>
