<!doctype html>
<html>
<head>

<style>
  body { margin: 0; background: #0e0a14; color: #f3e6c8; font-family: Inter, sans-serif; }
  .sheet { display: block; margin: 24px auto; }
  .o { stroke: #140d1c; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }

</head>
<body>
<svg id="screen" class="sheet" width="390" height="844" viewBox="0 0 390 844"></svg>
<svg id="cast" class="sheet" width="960" height="660" viewBox="0 0 960 660"></svg>
<svg id="ui" class="sheet" width="960" height="430" viewBox="0 0 960 430"></svg>
<script src="art.js"></script>
<script>
const { defs, g, grandma, influencer, hunter, developer, exorcist, kid, mortimer, bellhop, maid, girl,
  fearBar, bubble, plaque, OUT, ghostBase, hollow } = CO;
const T = (x, y, s, txt, o = {}) =>
  `<text x="${x}" y="${y}" font-size="${s}" font-family="${o.f || 'Caladea, serif'}" font-weight="${o.w || 400}"
    ${o.it ? 'font-style="italic"' : ''} fill="${o.c || '#f3e6c8'}" text-anchor="${o.a || 'start'}"
    letter-spacing="${o.ls || 0}" ${o.op ? `opacity="${o.op}"` : ''}>${txt}</text>`;

function star(x, y, r, fill) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    d += (i ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ' ' + (y + Math.sin(a) * rr).toFixed(1);
  }
  return `<path d="${d}Z" fill="${fill}" stroke="${OUT}" stroke-width="1.2" stroke-linejoin="round"/>`;
}
const stars = (x, y, n, r = 7, gap = 17) =>
  [0, 1, 2, 3, 4].map(i => star(x + i * gap, y, r, i < n ? '#f2c14e' : '#3a2e3e')).join('');

function room(x, y, w, h, paper, label, inner) {
  return `<g>
    <clipPath id="c${x}${y}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath>
    <g clip-path="url(#c${x}${y})">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${paper})"/>
      <rect x="${x}" y="${y + h - 14}" width="${w}" height="14" fill="url(#wood)"/>
      <rect x="${x}" y="${y + h - 17}" width="${w}" height="3" fill="#1d1218"/>
      ${inner}
      <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0a0610" opacity=".18"/>
    </g>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${OUT}" stroke-width="2"/>
    ${plaque(x + 6, y - 7, label)}
  </g>`;
}
const lampGlow = (x, y, r = 70) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 0.8}" fill="url(#lamp)"/>`;

// ================= MAIN SCREEN =================
function screen() {
  let s = defs;
  // sky + rain
  s += `<rect width="390" height="844" fill="url(#sky)"/>
    <circle cx="330" cy="140" r="26" fill="#efe6c8" opacity=".9"/><circle cx="341" cy="133" r="24" fill="#16101f"/>`;
  let rain = '';
  for (let i = 0; i < 90; i++) {
    const rx = (i * 53) % 400, ry = 96 + (i * 97) % 580;
    rain += `<path d="M${rx} ${ry} l-5 13" stroke="#8aa0c8" stroke-width="1" opacity=".25"/>`;
  }
  s += rain;

  // building shell
  s += `<rect x="12" y="166" width="366" height="486" fill="#2a1b24" stroke="${OUT}" stroke-width="2.5"/>`;
  // mansard roof
  s += `<path d="M6 168 L34 112 L356 112 L384 168 Z" fill="#2c2433" stroke="${OUT}" stroke-width="2.5"/>

    <rect x="300" y="84" width="16" height="30" fill="#3a2a2f" stroke="${OUT}" stroke-width="2"/>
    ${[70, 150, 240].map(x => `<rect x="${x}" y="128" width="22" height="28" rx="11" fill="#ffcf7a" opacity=".85" stroke="${OUT}" stroke-width="2"/>

  // roof sign
  const sign = 'GRAND VELOUR';
  s += `<rect x="92" y="94" width="206" height="26" rx="3" fill="#160e18" stroke="${OUT}" stroke-width="2"/>`;
  [...sign].forEach((ch, i) => {
    const dead = i === 9; // the U is out
    s += `<text x="${108 + i * 15.5}" y="113" font-family="Caladea, serif" font-weight="700" font-size="16" text-anchor="middle"
      fill="${dead ? '#3d2d33' : '#ffb35c'}" ${dead ? '' : 'filter="url(#glow)"'}>${ch}</text>`;
  });
  // floor bands
  s += `<rect x="12" y="322" width="366" height="8" fill="#1a1119"/><rect x="12" y="480" width="366" height="8" fill="#1a1119"/>`;

  // ---- Room 13 ----
  s += room(20, 172, 172, 150, 'paper-plum', 'ROOM 13', `
    ${lampGlow(160, 250)}
    <rect x="128" y="276" width="62" height="20" rx="3" fill="#7a2f3f" class="o"/>
    <rect x="126" y="262" width="10" height="44" rx="2" fill="#5a3a22" class="o"/>
    <rect x="134" y="272" width="22" height="9" rx="4" fill="#efe6d6" class="o"/>
    <circle cx="146" cy="276" r="2.5" fill="#bfe9ff"/>
    <rect x="138" y="296" width="52" height="12" fill="#5a3a22" class="o"/>
    <rect x="60" y="196" width="34" height="42" fill="#2a1a12" stroke="#c9a24a" stroke-width="3"/>
    <circle cx="77" cy="214" r="9" fill="#6b5244"/><path d="M66 238 Q77 222 88 238" fill="#6b5244"/>
    <circle cx="74" cy="213" r="1.5" fill="#ff5a4e"/><circle cx="80" cy="213" r="1.5" fill="#ff5a4e"/>
  `);
  s += g(52, 296, 0.9, mortimer());
  // floating teacup + motion
  s += `<g transform="translate(86 246) rotate(-14)">
      <path d="M-7 0 h14 l-2 9 h-10 Z" fill="#f4efe6" class="o"/><path d="M7 2 q5 1 0 5" fill="none" stroke="${OUT}" stroke-width="1.4"/>
      <ellipse cx="0" cy="10" rx="10" ry="2" fill="#f4efe6" class="o"/></g>
    <path d="M70 262 q-6 4 -2 10 M100 262 q6 4 2 10" stroke="#b6fff6" stroke-width="1.6" fill="none" opacity=".8"/>`;
  s += g(114, 308, 0.85, influencer(true));
  s += `<text x="128" y="230" font-family="Caladea" font-weight="700" font-size="20" fill="#ff5a4e" stroke="${OUT}" stroke-width="1" filter="url(#glow)">!</text>`;
  s += fearBar(114, 236, 0.66);
  s += bubble(112, 222, 'This is SO\ngoing viral.');

  s += room(198, 172, 172, 150, 'paper-green', 'LIBRARY', `

    <rect x="290" y="196" width="72" height="112" fill="#3a2418" class="o"/>
    ${[0, 1, 2, 3].map(r => `<rect x="294" y="${202 + r * 26}" width="64" height="2.5" fill="#24150e"/>` +
      [...Array(9)].map((_, i) => `<rect x="${295 + i * 7}" y="${205 + r * 26 + (i % 3)}" width="5.5" height="${20 - (i % 3)}"
        fill="${['#8b2f3a', '#2f5b7a', '#c9a24a', '#3f6b45', '#6a3f7a'][(i + r) % 5]}"/>`).join('')).join('')}

  `);
  s += g(244, 308, 0.85, grandma());
  s += g(330, 268, 0.8, maid());
  s += fearBar(244, 236, 0.12);
  s += bubble(240, 222, "I've buried\nscarier men.");

  // ---- Restaurant ----
  s += room(20, 330, 172, 150, 'paper-red', 'RESTAURANT', `
    ${lampGlow(104, 380, 90)}
    <path d="M104 330 v14" stroke="${OUT}" stroke-width="1.5"/>
    <g transform="rotate(8 104 344)"><path d="M88 350 h32 l-6 8 h-20 Z" fill="url(#brass)" class="o"/>

    <path d="M100 438 h70 v8 q-35 6 -70 0 Z" fill="#e6dcc4" class="o"/>
    <rect x="132" y="446" width="6" height="20" fill="#3a2418"/>
    <path d="M118 430 l-3 -10 h14 l-3 10 Z" fill="#cfeaf0" opacity=".8" class="o"/>

  s += g(60, 466, 0.85, hunter());
  s += g(150, 412, 0.75, bellhop());
  s += fearBar(60, 394, 0.52);
  s += bubble(60, 380, 'EMF is off\nthe charts!!');

  // ---- Room 7 ----
  s += room(198, 330, 172, 150, 'paper-gold', 'ROOM 7', `
    ${lampGlow(260, 390)}
    <rect x="304" y="372" width="54" height="94" fill="#4a2e1e" class="o"/>
    <rect x="308" y="376" width="22" height="86" fill="#3a2418" class="o"/>
    <path d="M331 376 L346 370 L346 468 L331 462 Z" fill="#5a3a26" class="o"/>

  s += g(343, 446, 0.6, girl());
  s += g(252, 466, 0.66, kid(false, false));
  s += fearBar(252, 400, 0.30);
  s += bubble(250, 386, 'The closet girl\nwants to play.', { fs: 9 });

  // ---- Lobby ----
  s += room(20, 488, 350, 160, 'paper-plum', 'LOBBY', `
    ${lampGlow(196, 540, 140)}
    <path d="M196 488 v18" stroke="${OUT}" stroke-width="1.5"/>
    <path d="M170 510 h52 l-8 12 h-36 Z" fill="url(#brass)" class="o"/>
    ${[176, 188, 200, 212].map(x => `<circle cx="${x}" cy="509" r="2.6" fill="#ffe0a0" filter="url(#glow)"/>`).join('')}
    <rect x="24" y="536" width="44" height="98" fill="#120c16" class="o"/>
    <rect x="28" y="540" width="36" height="90" fill="#1c2840"/>
    ${[...Array(10)].map((_, i) => `<path d="M${32 + (i * 13) % 30} ${546 + (i * 23) % 80} l-3 8" stroke="#8aa0c8" stroke-width="1" opacity=".6"/>`).join('')}
    <rect x="232" y="540" width="70" height="44" fill="#3a2418" class="o"/>
    ${[...Array(10)].map((_, i) => {
      const kx = 240 + (i % 5) * 12, ky = 548 + Math.floor(i / 5) * 18;
      return i === 2 ? `<text x="${kx}" y="${ky + 9}" font-size="8" font-family="Caladea" font-weight="700" fill="#b6fff6" text-anchor="middle" filter="url(#glow)">13</text>`
        : `<path d="M${kx} ${ky} v8" stroke="url(#brass)" stroke-width="2.4"/><circle cx="${kx}" cy="${ky}" r="2" fill="#c9a24a"/>`;
    }).join('')}
    <rect x="216" y="594" width="140" height="40" fill="#5a3a22" class="o"/>
    <rect x="212" y="588" width="148" height="8" rx="2" fill="#7a5034" class="o"/>
    <path d="M268 588 q6 -11 12 0 Z" fill="url(#brass)" class="o"/><circle cx="274" cy="575" r="1.6" fill="#ecc96c"/>
    <rect x="98" y="606" width="18" height="28" fill="#6b3f2a" class="o"/>
    <path d="M107 606 q-12 -14 -14 -24 M107 606 q4 -18 -2 -28 M107 606 q12 -12 16 -20" stroke="#6b5a3a" stroke-width="2" fill="none"/>
  `);
  s += g(318, 586, 0.75, mortimer(0.8));
  s += g(198, 634, 0.85, developer());
  s += fearBar(198, 562, 0.05);
  s += bubble(196, 548, 'Charming. Shame\nabout the bulldozers.', { fs: 9 });
  s += g(80, 634, 0.85, exorcist());
  s += `<g><rect x="34" y="510" width="124" height="18" rx="9" fill="#ff5a4e" stroke="${OUT}" stroke-width="1.5"/>
    ${T(96, 523, 9.5, 'EXORCIST INBOUND', { f: 'Inter', w: 800, c: '#fff', a: 'middle', ls: .3 })}</g>`;

  // sidewalk + vacancy sign
  s += `<rect x="0" y="652" width="390" height="22" fill="#1c1622"/><rect x="0" y="652" width="390" height="3" fill="#2f2738"/>
    `;

  // ---- HUD ----
  s += `<rect width="390" height="92" fill="#120b18"/><rect y="90" width="390" height="2" fill="url(#brass)"/>
    ${T(16, 32, 22, 'NIGHT 4', { w: 700, ls: 1 })}
    ${T(16, 50, 11, '2:13 AM · 9 guests', { f: 'Inter', c: '#a99bb3' })}
    <circle cx="170" cy="27" r="9" fill="url(#brass)" stroke="${OUT}" stroke-width="1.5"/>
    ${T(170, 31, 10, '$', { f: 'Inter', w: 800, c: '#5a4210', a: 'middle' })}
    ${T(184, 33, 19, '1,240', { f: 'Inter', w: 700 })}
    ${stars(296, 25, 3, 7.5, 18)}
    ${T(374, 50, 11, '3.2 · "Not even a draft."', { f: 'Inter', c: '#a99bb3', a: 'end' })}
    ${T(16, 75, 9.5, "MORTIMER'S PRESENCE", { f: 'Inter', w: 700, c: '#b6fff6', ls: .8 })}
    <rect x="170" y="67" width="204" height="10" rx="5" fill="#0a1a1f" stroke="#2b4a50"/>
    <rect x="171" y="68" width="130" height="8" rx="4" fill="#7cf3e6" filter="url(#glow)"/>`;

  // ---- Scare cards ----
  s += `<rect y="674" width="390" height="170" fill="#120b18"/><rect y="674" width="390" height="2" fill="url(#brass)"/>
    ${T(16, 698, 11, 'SCARES', { f: 'Inter', w: 800, ls: 1.5 })}
    ${T(374, 698, 10.5, 'pick a scare, then tap a room', { f: 'Inter', c: '#8a7c95', a: 'end' })}`;
  const icons = [
    ['Creaky Door', 4, `<rect x="-12" y="-18" width="22" height="36" fill="#5a3a26" class="o"/><path d="M10 -18 L18 -14 L18 22 L10 18 Z" fill="#3a2418" class="o"/><circle cx="5" cy="2" r="1.8" fill="#ecc96c"/><path d="M22 -10 q5 6 0 12 M26 -14 q8 10 0 20" stroke="#b6fff6" stroke-width="1.6" fill="none"/>`],
    ['Flicker Lights', 5, `<circle cx="0" cy="-6" r="11" fill="#ffe08a" class="o" filter="url(#glow)"/><rect x="-5" y="5" width="10" height="9" fill="#9a9aa4" class="o"/><path d="M-20 -16 l5 4 -4 3 5 4 M20 -16 l-5 4 4 3 -5 4" stroke="#ffe08a" stroke-width="1.8" fill="none"/>`],
    ['Floating Teacup', 7, `<g transform="rotate(-14)"><path d="M-10 -6 h20 l-3 13 h-14 Z" fill="#f4efe6" class="o"/><path d="M10 -3 q7 2 0 7" fill="none" stroke="${OUT}" stroke-width="1.6"/><ellipse cx="0" cy="9" rx="14" ry="3" fill="#f4efe6" class="o"/></g><path d="M-16 14 q-5 4 -1 9 M16 14 q5 4 1 9" stroke="#b6fff6" stroke-width="1.6" fill="none"/>`],
    ['Portrait Eyes', 9, `<rect x="-14" y="-18" width="28" height="34" fill="#2a1a12" stroke="#c9a24a" stroke-width="3"/><circle cx="0" cy="-4" r="7" fill="#6b5244"/><path d="M-9 16 Q0 4 9 16" fill="#6b5244"/><circle cx="-3" cy="-5" r="1.8" fill="#ff5a4e" filter="url(#glow)"/><circle cx="3" cy="-5" r="1.8" fill="#ff5a4e" filter="url(#glow)"/>`],
  ];
  icons.forEach(([name, cost, icon], i) => {
    const x = 12 + i * 93, y = 710, sel = i === 2;
    s += `<rect x="${x}" y="${y}" width="86" height="118" rx="8" fill="${sel ? '#1d2a2e' : '#1e1424'}"
        stroke="${sel ? '#7cf3e6' : '#3a2c42'}" stroke-width="${sel ? 2 : 1.5}" ${sel ? 'filter="url(#glow)"' : ''}/>
      ${g(x + 43, y + 40, 1, icon)}
      ${T(x + 43, y + 84, 10.5, name, { f: 'Inter', w: 600, a: 'middle' })}
      <rect x="${x + 8}" y="${y + 93}" width="70" height="17" rx="8.5" fill="#0a1a1f" stroke="#2b4a50"/>
      ${T(x + 43, y + 105.5, 10, cost + ' presence', { f: 'Inter', w: 700, c: '#7cf3e6', a: 'middle' })}`;

  return s;
}

// ================= CAST SHEET =================
function cast() {
  let s = defs + `<rect width="960" height="660" fill="#140d1a"/>`;
  s += T(40, 52, 30, 'CHECKED OUT', { w: 700, ls: 3 }) + T(296, 52, 15, 'the cast', { it: 1, c: '#a99bb3' });
  // staff panel
  s += `<rect x="24" y="74" width="912" height="262" rx="10" fill="url(#paper-plum)" stroke="${OUT}" stroke-width="2"/>
    <rect x="24" y="74" width="912" height="262" rx="10" fill="#0a0610" opacity=".35"/>
    ${T(44, 102, 13, 'THE STAFF', { f: 'Inter', w: 800, ls: 2, c: '#b6fff6' })}${T(150, 102, 13, '(deceased)', { it: 1, c: '#a99bb3' })}`;
  const staff = [
    [mortimer(), 'MORTIMER', 'Room 13, since 1962.', 'Owner. Tired. Always tired.'],
    [bellhop(), 'EUGENE', 'Bellhop. Still waiting on', 'a tip from 1974.'],
    [maid(), 'DORIS', 'Employee of the Month', 'since 1987. Every month.'],
    [girl(), 'LOTTIE', 'Wants to play hide and seek.', 'She is very good at it.'],
  ];
  staff.forEach(([art, n, a, b], i) => {
    const cx = 138 + i * 228;
    s += `<ellipse cx="${cx}" cy="262" rx="40" ry="6" fill="#000" opacity=".3"/>` + g(cx, 248, 2.0, art);
    s += T(cx, 290, 15, n, { w: 700, a: 'middle', ls: 1.5 }) + T(cx, 308, 12, a, { it: 1, c: '#cbbfd3', a: 'middle' }) + T(cx, 323, 12, b, { it: 1, c: '#cbbfd3', a: 'middle' });
  });
  // guests panel
  s += `<rect x="24" y="352" width="912" height="290" rx="10" fill="url(#paper-gold)" stroke="${OUT}" stroke-width="2"/>
    <rect x="24" y="352" width="912" height="290" rx="10" fill="#0a0610" opacity=".35"/>
    ${T(44, 380, 13, 'THE GUESTS', { f: 'Inter', w: 800, ls: 2, c: '#ffcf7a' })}${T(162, 380, 13, '(for now)', { it: 1, c: '#a99bb3' })}`;
  const guests = [
    [influencer(), 'KAYLEIGH', 'Influencer.', 'Fear = followers.'],
    [hunter(), 'DALE', 'Ghost hunter.', 'Has never seen one.'],
    [grandma(), 'GRANDMA PEARL', 'Buried 3 husbands.', 'Not scared of you.'],
    [kid(), 'TOMMY', 'Can see you.', 'Wants to play.'],
    [developer(), 'MR. CRANE', 'Developer.', 'Wants a parking lot.'],
    [exorcist(), 'FATHER DOYLE', 'Exorcist.', 'Bad for business.'],
  ];
  guests.forEach(([art, n, a, b], i) => {
    const cx = 100 + i * 152;
    s += `<ellipse cx="${cx}" cy="566" rx="28" ry="5" fill="#000" opacity=".35"/>` + g(cx, 566, 1.75, art);
    s += T(cx, 592, 13.5, n, { w: 700, a: 'middle', ls: 1 }) + T(cx, 609, 12, a, { it: 1, c: '#e0d2b8', a: 'middle' }) + T(cx, 624, 12, b, { it: 1, c: '#e0d2b8', a: 'middle' });
  });
  return s;
}

// ================= UI BITS =================
function ui() {

  s += `<g transform="translate(36 76) rotate(-2)">

  </g>`;

  // new hire card
  const newHire = ghostBase(`<path d="M-9 -44 L0 -36 L9 -44" stroke="#7cc9c0" stroke-width="2" fill="none"/>
      <rect x="-6" y="-34" width="12" height="9" rx="2" fill="#e8fffb" opacity=".7" stroke="#7cc9c0"/>
      <circle cx="0" cy="-29.5" r="2.6" fill="#1b3340"/>`,
    hollow(), { hat: `<path d="M-13 -64 h26 l-4 -9 h-18 Z" fill="#e8fffb" opacity=".8" stroke="#7cc9c0"/>` });
  s += `<g transform="translate(650 76)">
    <rect width="280" height="320" rx="10" fill="#1e1424" stroke="#7cf3e6" stroke-width="2"/>
    ${T(16, 28, 11, 'NEW HIRE', { f: 'Inter', w: 800, c: '#7cf3e6', ls: 2 })}
    ${T(264, 28, 11, 'died tonight', { it: 1, c: '#a99bb3', a: 'end' })}
    <rect x="16" y="40" width="248" height="130" rx="6" fill="url(#paper-plum)"/>
    ${g(140, 158, 1.45, newHire)}
    ${T(140, 196, 18, 'GARY', { w: 700, a: 'middle', ls: 2 })}
    ${T(140, 214, 12, 'Ate the 1962 shrimp cocktail.', { it: 1, c: '#cbbfd3', a: 'middle' })}
    ${['Denial', 'Anger', 'Bargain', 'Sad', 'Accept'].map((st, i) => {
      const x = 22 + i * 49, on = i === 0;
      return `<rect x="${x}" y="230" width="44" height="22" rx="4" fill="${on ? '#7cf3e6' : '#2b2034'}" stroke="${on ? '#7cf3e6' : '#3a2c42'}"/>
        ${T(x + 22, 245, 9.5, st, { f: 'Inter', w: 700, c: on ? '#0d1a1d' : '#7d6f88', a: 'middle' })}`;
    }).join('')}
    ${T(16, 276, 12.5, 'Still thinks he is a guest.', { c: '#f3e6c8' })}
    ${T(16, 294, 12.5, 'Keeps ordering room service.', { c: '#f3e6c8' })}
    ${T(16, 312, 11, 'Scare power: none. Complaints: many.', { f: 'Inter', c: '#8a7c95' })}
  </g>`;
  return s;
}

document.getElementById('screen').innerHTML = screen();
